title: Visual Studio 2026 Community Insiders Kullanımı — Uygulama
description: Community Insiders kurulumu, Python development iş yükü, Python yorumlayıcısı, temel diller/iş yükleri, Python projesi, çalıştırma,
  terminal ve hata ayıklama bilgilerini ölçer.
questions:
- id: q1
  question: Bu derste kullanılacak Visual Studio sürümü hangisidir?
  options:
  - Visual Studio 2026 Community Insiders
  - Visual Studio Code Stable
  - Visual Studio 2022 Professional
  - Python IDLE
  answer: 0
  explanation: Dersin hedef geliştirme ortamı Visual Studio 2026 Community Insiders sürümüdür.
- id: q2
  question: Visual Studio 2026 Community Insiders için derste verilen resmî indirme adresi hangisidir?
  options:
  - python.org/downloads/
  - visualstudio.microsoft.com/insiders/
  - github.com/microsoft/vscode
  - makecode.microbit.org
  answer: 1
  explanation: Microsoft, Visual Studio Insiders indirmelerini visualstudio.microsoft.com/insiders/ sayfasından sunar.
- id: q3
  question: Visual Studio Installer içinde Python çalışmaları için hangi iş yükü seçilmelidir?
  options:
  - Game development with C++
  - Desktop development with C++
  - Python development
  - Node.js development
  answer: 2
  explanation: Microsoft’un Visual Studio Python belgeleri Python araçları için Python development iş yükünün seçilmesini belirtir.
- id: q4
  question: Visual Studio’ya Python development iş yükünü eklemek tek başına neden yeterli olmayabilir?
  options:
  - Çünkü mutlaka Java kurulmalıdır
  - Çünkü Visual Studio yalnız C# çalıştırır
  - Çünkü GitHub hesabı zorunludur
  - Çünkü Python kodunu çalıştıracak ayrı bir Python yorumlayıcısı da gerekir
  answer: 3
  explanation: Visual Studio Python araçlarını sağlar; Python kodunun çalışması için ayrıca desteklenen bir Python yorumlayıcısı gerekir.
- id: q5
  question: Visual Studio 2026 arayüzünü Türkçe kullanmak için Installer’da hangi bölümden Türkçe eklenebilir?
  options:
  - Dil paketleri / Language packs
  - Git Changes
  - Solution Explorer
  - Terminal
  answer: 0
  explanation: Visual Studio Installer içindeki Language packs/Dil paketleri bölümünden desteklenen arayüz dilleri yönetilir.
- id: q6
  question: Dersin sistem notuna göre Visual Studio 2026 ARM64 sürümünde Python geliştirme iş yükü için durum nedir?
  options:
  - Her ARM64 cihazda zorunlu olarak yüklüdür
  - Visual Studio ARM64 üzerinde Python development iş yükü desteklenmez
  - Yalnız internet yokken çalışır
  - Sadece macOS üzerinde desteklenir
  answer: 1
  explanation: Microsoft’un Visual Studio 2026 sistem gereksinimlerinde ARM64 Visual Studio için Python development iş yükünün desteklenmediği
    belirtilir.
- id: q7
  question: Visual Studio Installer’daki “iş yükü (workload)” neyi ifade eder?
  options:
  - Sadece programlama dilinin dosya uzantısını
  - Bir kullanıcının proje klasörünü
  - Belirli geliştirme senaryosu için gerekli araç ve bileşen grubunu
  - Bilgisayarın işlemci kullanım yüzdesini
  answer: 2
  explanation: İş yükleri; Python, .NET, C++ veya web geliştirme gibi senaryolar için gereken bileşenleri gruplar.
- id: q8
  question: C# ile Visual Studio’da aşağıdakilerden hangisi yapılabilecek alanlara iyi bir örnektir?
  options:
  - Yalnız resim sıkıştırma
  - Sadece klavye sürücüsü güncelleme
  - Yalnız PDF okuma
  - .NET masaüstü, web/API ve çok platformlu uygulama geliştirme
  answer: 3
  explanation: C# ve .NET iş yükleri masaüstü, web/API ve çok platformlu uygulama geliştirme gibi alanlarda kullanılabilir.
- id: q9
  question: C/C++ iş yükleri hangi kullanım alanıyla özellikle ilişkilidir?
  options:
  - Yüksek performanslı yerel uygulamalar, sistem/oyun ve bazı gömülü geliştirme senaryoları
  - Yalnız kelime işlem
  - Sadece e-posta gönderme
  - Yalnız sunum hazırlama
  answer: 0
  explanation: C/C++ Visual Studio’da yüksek performanslı yerel yazılımlar, oyun, sistem ve belirli gömülü/Linux geliştirme senaryolarında kullanılır.
- id: q10
  question: JavaScript/TypeScript için Visual Studio’daki yaygın geliştirme alanı hangisidir?
  options:
  - Sadece BIOS güncelleme
  - Web ve Node.js uygulamaları
  - Yalnız elektronik devre çizimi
  - Sadece 3D baskı dilimleme
  answer: 1
  explanation: JavaScript/TypeScript web ön yüzü ve Node.js tabanlı uygulamalarda yaygın olarak kullanılır.
- id: q11
  question: Yeni bir Python projesi oluştururken derste önerilen şablon hangisidir?
  options:
  - Blank Solution
  - C++ Console App
  - Python Application
  - Class Library (.NET)
  answer: 2
  explanation: Ders akışında ilk Python projesi için Python Application şablonu kullanılır.
- id: q12
  question: “Python ortamı/yorumlayıcısı” ile ilgili doğru ifade hangisidir?
  options:
  - Yalnız proje dosyalarının adını tutar
  - Sadece Visual Studio temasını belirler
  - Bir Git branch’idir
  - .py kaynak kodunu gerçekten çalıştıran Python kurulumudur
  answer: 3
  explanation: Yorumlayıcı, Python kaynak kodunu yürütür; proje ve kaynak dosyasıyla aynı kavram değildir.
- id: q13
  question: Örnek programdaki `float(input(...))` kullanımının amacı nedir?
  options:
  - Kullanıcı girdisini alıp ondalıklı sayıya dönüştürmek
  - Programı otomatik olarak GitHub’a yüklemek
  - Bir kesme noktası oluşturmak
  - Visual Studio’yu kapatmak
  answer: 0
  explanation: input() metin alır; float() bu metni ondalıklı sayıya dönüştürür.
- id: q14
  question: Visual Studio’da Ctrl+F5 ne yapar?
  options:
  - Projeyi siler
  - Programı hata ayıklama olmadan başlatır
  - Türkçe dil paketini açar
  - Yeni terminal sekmesi oluşturur
  answer: 1
  explanation: Ctrl+F5, Start Without Debugging/Hata Ayıklama Olmadan Başlat komutudur.
- id: q15
  question: Visual Studio’da F5’in temel görevi nedir?
  options:
  - Dosyayı yeniden adlandırmak
  - Yalnız kaydetmek
  - Programı hata ayıklayıcı ile başlatmak/devam ettirmek
  - Installer’ı açmak
  answer: 2
  explanation: F5 Visual Studio’da hata ayıklama oturumunu başlatmak veya sürdürmek için kullanılır.
- id: q16
  question: Visual Studio’da çalışan hata ayıklama oturumu hangi kısayolla durdurulabilir?
  options:
  - Ctrl+P
  - F9
  - Ctrl+F5
  - Shift+F5
  answer: 3
  explanation: Shift+F5, Stop Debugging/Hata Ayıklamayı Durdur komutudur.
- id: q17
  question: Bir satıra breakpoint (kesme noktası) ekleyip/kaldırmak için yaygın Visual Studio kısayolu hangisidir?
  options:
  - F9
  - Ctrl+R
  - Alt+Enter
  - Shift+F11
  answer: 0
  explanation: F9 seçili satırdaki kesme noktasını açıp kapatmak için kullanılır.
- id: q18
  question: Visual Studio’nun tümleşik terminali derste hangi menü yoluyla açılmaktadır?
  options:
  - Dosya → Yazdır
  - Görünüm → Terminal
  - Yardım → Hakkında
  - Git → Clone
  answer: 1
  explanation: Ders akışında tümleşik terminal Görünüm/View → Terminal yoluyla açılır.
- id: q19
  question: Terminal proje klasöründeyken `program.py` dosyasını çalıştırmak için hangi komut kullanılabilir?
  options:
  - git program.py
  - run program.py
  - python program.py
  - build program.py
  answer: 2
  explanation: Python komutu PATH üzerinde tanımlıysa `python program.py` dosyayı terminalden çalıştırır.
- id: q20
  question: Terminalde çalışan ve bitmeyen bir Python işlemini kesmek için çoğu terminalde hangi tuş birleşimi kullanılır?
  options:
  - Ctrl+S
  - Ctrl+B
  - Alt+F4
  - Ctrl+C
  answer: 3
  explanation: Ctrl+C terminaldeki ön plan işlemini kesmek için yaygın yöntemdir; Python çoğunlukla KeyboardInterrupt ile sonlanır.
