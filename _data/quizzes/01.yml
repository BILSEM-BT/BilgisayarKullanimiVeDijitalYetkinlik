title: Bilgisayarın Tarihçesi
description: Bilgisayar tarihindeki ana dönüşümleri, “ilk bilgisayar” tartışmasını ve teknolojilerin birbirine nasıl bağlandığını değerlendir.
questions:
- id: q1
  question: Bu derse göre 'ilk bilgisayar hangisidir?' sorusunun tek bir cevabı olmamasının temel nedeni nedir?
  options:
  - İlk olmayı belirlemek için elektronik, programlanabilirlik, genel amaçlılık ve saklı program gibi farklı ölçütler kullanılabilmesi
  - Bilgisayarların tarihinin bilinmemesi
  - Bütün erken bilgisayarların aynı yıl yapılması
  - Hiçbir erken bilgisayarın çalışmamış olması
  answer: 0
  explanation: Hangi özelliğin 'ilk' sayıldığına göre Z3, Colossus, ENIAC, Manchester Baby gibi farklı sistemler öne çıkabilir.
- id: q2
  question: Abaküsün bilgisayar tarihindeki önemini en doğru hangi ifade açıklar?
  options:
  - Bellekte program saklayan ilk elektronik bilgisayardır
  - Hesaplamayı fiziksel bir araçla destekleme fikrinin erken örneklerinden biridir
  - İlk web sunucusudur
  - İlk mikroişlemciyi kullanmıştır
  answer: 1
  explanation: Abaküs modern bilgisayar değildir; hesaplama işlemini fiziksel bir araçla destekleyen çok eski örneklerden biridir.
- id: q3
  question: Jacquard tezgâhındaki delikli kartların bilgisayar tarihi açısından önemli fikri nedir?
  options:
  - İlk internet bağlantısını kurması
  - Elektronik transistör kullanması
  - Makinenin davranışının dışarıdan verilen bilgi düzeniyle kontrol edilebilmesi
  - Programı RAM'de saklaması
  answer: 2
  explanation: Delikli kartların düzeni tezgâhın davranışını belirliyordu; bu fikir programlanabilirlik tarihinin önemli öncüllerindendir.
- id: q4
  question: Babbage'ın Analytical Engine tasarımındaki 'store' ve 'mill' neye benzetilebilir?
  options:
  - Klavye ve fare
  - Web ve internet
  - SSD ve USB bellek
  - Bellek ve işlem birimi
  answer: 3
  explanation: Store verileri/ara sonuçları, mill ise aritmetik işlemleri tutacak şekilde tasarlanmıştı.
- id: q5
  question: Ada Lovelace'ın Analytical Engine hakkındaki en önemli kavramsal görüşlerinden biri neydi?
  options:
  - İnterneti icat etmesi
  - Uygun temsil kullanılırsa makinenin yalnızca sayısal niceliklerin ötesinde sembolleri de işleyebileceğini görmesi
  - Transistörü üretmesi
  - ENIAC'ı programlaması
  answer: 1
  explanation: Lovelace, sayısal temsillerin başka sembolik içerikleri de temsil edebileceğini fark ederek genel amaçlı hesaplamanın gücünü öngördü.
- id: q6
  question: Z3 için hangisi doğrudur?
  options:
  - İlk World Wide Web sunucusudur
  - Mikroişlemci tabanlı bir kişisel bilgisayardır
  - Program kontrollü elektromekanik dijital bilgisayarların önemli erken örneklerindendir
  - Vakum tüplü genel amaçlı bir web sunucusudur
  answer: 2
  explanation: Konrad Zuse'nin 1941'de tamamladığı Z3 röle tabanlı, program kontrollü erken dijital bilgisayarlardandır.
- id: q7
  question: Colossus'u modern genel amaçlı bilgisayardan ayıran önemli özellik hangisidir?
  options:
  - Elektronik bileşen kullanmaması
  - Hiç programlanabilir davranış göstermemesi
  - Mikroişlemci tabanlı kişisel bilgisayar olması
  - Belirli şifre çözme görevleri için tasarlanmış özel amaçlı bir sistem olması
  answer: 3
  explanation: Colossus elektronik ve programlanabilir özellikler taşıyordu; ancak genel amaçlı değil, özellikle Lorenz şifre trafiğinin analizine yönelik özel amaçlıydı.
- id: q8
  question: ENIAC'ın ilk programlama yönteminde program değişikliği nasıl yapılıyordu?
  options:
  - Kablolar, bağlantı panelleri ve anahtarlar yeniden düzenlenerek
  - GitHub'dan program indirilerek
  - SSD'deki Python dosyası çalıştırılarak
  - Web tarayıcısından kod yüklenerek
  answer: 0
  explanation: ENIAC'ın ilk kullanımında programlama fiziksel bağlantıların ve anahtarların yeniden yapılandırılmasını gerektiriyordu.
- id: q9
  question: Manchester Baby'nin 1948'deki tarihsel önemi nedir?
  options:
  - İlk kişisel bilgisayar olması
  - İlk grafik kullanıcı arayüzüne sahip olması
  - Bellekte saklanan bir programı elektronik dijital bilgisayarda çalıştıran temel dönüm noktalarından biri olması
  - İlk akıllı telefon olması
  answer: 2
  explanation: Manchester Baby, saklı program yaklaşımının fiilen çalıştırıldığı önemli erken elektronik bilgisayardır.
- id: q10
  question: EDSAC'ın programlama tarihi açısından önemli katkılarından biri hangisidir?
  options:
  - İlk web tarayıcısını geliştirmesi
  - İlk GPU'yu kullanması
  - İlk dokunmatik ekranı kullanması
  - Tekrar kullanılabilir subroutine/kısa program parçalarının kullanımını geliştirmesi
  answer: 3
  explanation: Maurice Wilkes'in EDSAC çalışmaları, ortak işlemler için tekrar kullanılabilir subroutine kütüphanelerinin gelişimine katkı sağladı.
- id: q11
  question: Transistörün vakum tüplerine göre bilgisayar teknolojisine getirdiği temel avantaj hangisidir?
  options:
  - Daha küçük, daha güvenilir ve daha düşük güç tüketen elektronik devreler oluşturmayı kolaylaştırması
  - Bilgisayarların artık yazılıma ihtiyaç duymamasını sağlaması
  - İnternet bağlantısını icat etmesi
  - Tüm depolama ihtiyacını ortadan kaldırması
  answer: 0
  explanation: Transistör, büyük ve enerji tüketen vakum tüplerinin yerine daha küçük ve güvenilir yarı iletken anahtarlama elemanlarının kullanılmasını sağladı.
- id: q12
  question: Entegre devre yaklaşımının temel etkisi neydi?
  options:
  - Bütün bilgisayarların mekanik hale gelmesi
  - Birçok elektronik bileşenin aynı yarı iletken yapı üzerinde birleştirilmesini mümkün kılması
  - Yazılım ihtiyacının ortadan kalkması
  - Bilgisayarların yalnızca hesap makinesi olarak kullanılmaya başlanması
  answer: 1
  explanation: Entegre devreler çok sayıda elektronik bileşenin daha küçük ve güvenilir yapılar içinde birleştirilmesini sağladı.
- id: q13
  question: Intel 4004'ün bilgisayar tarihi açısından önemi en doğru nasıl açıklanır?
  options:
  - İlk web tarayıcısını çalıştırması
  - İlk vakum tüpü olması
  - İlk kişisel bilgisayarın adı olması
  - Programlanabilir işlemci işlevlerini tek bir ticari mikroişlemci çipinde bütünleştiren önemli erken ürünlerden biri olması
  answer: 3
  explanation: 1971'de tanıtılan Intel 4004, programlanabilir işlemci işlevlerinin tek çipte bütünleşmesini temsil eden önemli erken ticari mikroişlemcilerden biridir.
- id: q14
  question: IBM PC'nin 1981'deki en önemli etkilerinden biri hangisidir?
  options:
  - Geniş bir uyumlu donanım, yazılım ve çevre birimi ekosisteminin büyümesini hızlandırması
  - Kişisel bilgisayarı tarihte ilk kez icat etmesi
  - İnterneti başlatması
  - İlk transistörü içermesi
  answer: 0
  explanation: IBM PC'den önce kişisel bilgisayarlar vardı; IBM PC'nin güçlü tarihsel etkilerinden biri PC uyumluluğu etrafında büyük bir ekosistem oluşmasıdır.
- id: q15
  question: İnternet ve World Wide Web arasındaki doğru ilişki hangisidir?
  options:
  - İnternet Web'in içinde çalışan küçük bir uygulamadır
  - Web, internet altyapısı üzerinde çalışan hizmetlerden biridir
  - İkisi tamamen aynı kavramdır
  - Web internetten daha eski bir donanımdır
  answer: 1
  explanation: İnternet ağ altyapısıdır; Web bu altyapı üzerinde çalışan bilgi paylaşım sistemlerinden biridir.
- id: q16
  question: Tim Berners-Lee World Wide Web için ilk önerisini hangi yıl CERN'de hazırladı?
  options:
  - '1971'
  - '1946'
  - '1989'
  - '2005'
  answer: 2
  explanation: CERN kaynaklarına göre Berners-Lee ilk Web önerisini Mart 1989'da hazırladı.
- id: q17
  question: CERN'in 1993'te Web yazılımını açık biçimde kullanıma sunmasının önemi neydi?
  options:
  - Web teknolojisinin daha geniş biçimde benimsenmesini ve geliştirilmesini kolaylaştırması
  - İnternetin o yıl ilk kez icat edilmesi
  - Bilgisayarlarda CPU kullanımının sona ermesi
  - Web'in yalnızca CERN içinde kalmasını sağlaması
  answer: 0
  explanation: CERN'in açık erişim kararı Web'in dünya çapında yayılmasını kolaylaştıran önemli etkenlerden biriydi.
- id: q18
  question: Bulut bilişim bilgisayar kullanımını hangi açıdan değiştirdi?
  options:
  - Bilgisayarların ağ bağlantısına ihtiyaç duymasını tamamen ortadan kaldırdı
  - Yerel cihazların tamamını yok etti
  - Hesaplama ve depolamanın önemli bölümünün uzaktaki sunucularda yapılabilmesini yaygınlaştırdı
  - Yazılım kullanımını bitirdi
  answer: 2
  explanation: Bulut hizmetlerinde kullanıcı cihazı çoğu zaman internet üzerinden uzak sunuculardaki hesaplama ve depolama kaynaklarını kullanır.
- id: q19
  question: Bilgisayar nesilleri sınıflandırması hakkında hangisi daha doğru bir yaklaşımdır?
  options:
  - Her nesil tam olarak aynı gün başlamıştır
  - Öğretici bir yaklaşık sınıflandırmadır; gerçek teknoloji geçişleri keskin sınırlarla gerçekleşmez
  - Beşinci nesil diğerlerinden daha kesin bir donanım tanımıdır
  - Eski teknoloji yeni nesil başladığı anda tamamen ortadan kalkar
  answer: 1
  explanation: Teknolojiler birbirinin üzerine biner; nesil kavramı tarihsel süreci anlamayı kolaylaştıran yaklaşık bir öğretim modelidir.
- id: q20
  question: Bu dersin bilgisayar tarihine yaklaşımını en iyi hangi ifade özetler?
  options:
  - Yalnızca bilgisayar markalarını ezberlemek
  - Sadece 1980 sonrası bilgisayarları incelemek
  - Bilgisayar tarihini yalnızca işlemci hızlarıyla açıklamak
  - Tek tek cihazları ezberlemekten çok, problemlerin yeni fikir ve teknolojilerle nasıl dönüştürüldüğünü anlamak
  answer: 3
  explanation: Ders tarihsel gelişimi problem → fikir → teknoloji → yeni kullanım biçimi zinciri üzerinden ele alır.
