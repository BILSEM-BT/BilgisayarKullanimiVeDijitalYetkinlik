title: Klavye Tuşları ve Klavye Kısayolları
description: Klavye tuşlarını, metin gezinmesini ve Windows'ta en yararlı kısayolları uygulama senaryolarıyla değerlendir.
questions:
- id: q1
  question: Backspace tuşunun metindeki yaygın görevi nedir?
  options:
  - İmlecin solundaki karakteri silmek
  - İmlecin sağındaki karakteri silmek
  - Tüm belgeyi seçmek
  - Ayarlar'ı açmak
  answer: 0
  explanation: Backspace genellikle imlecin sol tarafındaki karakteri siler.
- id: q2
  question: Delete tuşu metinde genellikle ne yapar?
  options:
  - Yalnız büyük harf açar
  - İmlecin sağındaki karakteri veya seçili içeriği siler
  - Belgeyi kaydeder
  - Windows'u kilitler
  answer: 1
  explanation: Delete ile Backspace yön bakımından farklı davranır.
- id: q3
  question: Shift tuşunun temel kullanım örneği hangisidir?
  options:
  - Bilgisayarı kapatmak
  - Dosyayı kalıcı silmek
  - Bir harfi geçici olarak büyük yazmak veya ikinci karaktere erişmek
  - Wi-Fi'yi açmak
  answer: 2
  explanation: Shift başka tuşlarla birlikte geçici değiştirici olarak kullanılır.
- id: q4
  question: Caps Lock ne yapar?
  options:
  - Pano geçmişini açar
  - Dosyayı yeniden adlandırır
  - Görev Yöneticisi'ni açar
  - Büyük harf yazma modunu açıp kapatır
  answer: 3
  explanation: Caps Lock sürekli büyük harf durumunu değiştirir.
- id: q5
  question: Tab tuşu formlarda yaygın olarak ne işe yarar?
  options:
  - Belgeyi kapatmak
  - Bir sonraki alana veya odaklanabilir öğeye geçmek
  - Ekran görüntüsü almak
  - Dosyayı kopyalamak
  answer: 1
  explanation: Tab, arayüzde odak geçişi ve bazı metinlerde girinti için kullanılır.
- id: q6
  question: Shift + Tab kombinasyonu çoğu arayüzde ne yapar?
  options:
  - Bilgisayarı kilitler
  - Tüm metni siler
  - Odakta geriye doğru ilerler
  - Tarayıcıyı yeniler
  answer: 2
  explanation: Shift+Tab, Tab ile yapılan ileri odak geçişinin tersidir.
- id: q7
  question: Home tuşunun metinde yaygın görevi hangisidir?
  options:
  - İmleci belgenin sonuna götürmek
  - Windows ana ekranına dönmek
  - Dosyayı açmak
  - İmleci satırın başına götürmek
  answer: 3
  explanation: Home çoğu metin düzenleyicide satırın başına hareket eder.
- id: q8
  question: End tuşu çoğu metin düzenleyicide ne yapar?
  options:
  - İmleci satırın sonuna götürür
  - Bilgisayarı kapatır
  - Metni kalın yapar
  - Geri Dönüşüm Kutusu'nu açar
  answer: 0
  explanation: End tuşu satırın sonuna hızlı geçiş sağlar.
- id: q9
  question: Ctrl + C kısayolu ne yapar?
  options:
  - Seçili içeriği keser
  - Belgeyi kapatır
  - Seçili içeriği kopyalar
  - Ayarlar'ı açar
  answer: 2
  explanation: Ctrl+C yaygın kopyalama kısayoludur.
- id: q10
  question: Ctrl + X ne için kullanılır?
  options:
  - Yapıştırmak için
  - Tümünü seçmek için
  - Masaüstünü göstermek için
  - Seçili içeriği kesmek için
  answer: 3
  explanation: Ctrl+X seçili içeriği taşımaya hazırlamak üzere keser.
- id: q11
  question: Ctrl + V ne yapar?
  options:
  - Panodaki içeriği yapıştırır
  - Son işlemi geri alır
  - Dosya Gezgini'ni açar
  - Yardımı açar
  answer: 0
  explanation: Ctrl+V kopyalanan veya kesilen içeriği hedefe yapıştırır.
- id: q12
  question: Ctrl + Z'nin yaygın görevi nedir?
  options:
  - Tüm metni seçmek
  - Son işlemi geri almak
  - Bilgisayarı kilitlemek
  - Görev Yöneticisi'ni açmak
  answer: 1
  explanation: Ctrl+Z birçok uygulamada son işlemi geri alır.
- id: q13
  question: Ctrl + A ne anlama gelir?
  options:
  - Yeni belge açmak
  - Yazdırmak
  - Bilgisayarı kapatmak
  - Geçerli alandaki tüm öğeleri veya metni seçmek
  answer: 3
  explanation: Ctrl+A odağın bulunduğu alandaki tüm içeriği seçer.
- id: q14
  question: Windows + E kısayolu ne açar?
  options:
  - Dosya Gezgini'ni
  - Ayarlar'ı
  - Pano geçmişini
  - Görev Yöneticisi'ni
  answer: 0
  explanation: Windows+E Windows Dosya Gezgini'ni açar.
- id: q15
  question: Windows + I ne açar?
  options:
  - Dosya Gezgini'ni
  - Ayarlar uygulamasını
  - Başlat menüsünü kapatır
  - Yazıcı kuyruğunu
  answer: 1
  explanation: Windows+I doğrudan Windows Ayarları'nı açar.
- id: q16
  question: Ctrl + Shift + Esc ne açar?
  options:
  - Dosya Gezgini'ni
  - Pano geçmişini
  - Görev Yöneticisi'ni
  - Word'ü
  answer: 2
  explanation: Bu kısayol Görev Yöneticisi'ni doğrudan açar.
- id: q17
  question: F2 Windows Dosya Gezgini'nde seçili öğe üzerinde yaygın olarak ne yapar?
  options:
  - Yeniden adlandırmayı başlatır
  - Dosyayı kopyalar
  - Ekranı kapatır
  - Yeni klasör açar
  answer: 0
  explanation: F2 seçili dosya/klasörü yeniden adlandırmak için yaygın Windows kısayoludur.
- id: q18
  question: Fn tuşu için en doğru açıklama hangisidir?
  options:
  - Her bilgisayarda F5'i zorunlu olarak ses açar
  - Dosya kopyalamanın standart Windows kısayoludur
  - Dizüstü klavyelerde bazı tuşların ikinci işlevlerine erişebilir ve davranışı üreticiye göre değişebilir
  - Windows'u yeniden başlatır
  answer: 2
  explanation: Fn tuşu donanım üreticisine bağlı özel işlevlerle kullanılabilir.
- id: q19
  question: AltGr ile hangi karakterlerin yazılacağı neye bağlı olabilir?
  options:
  - SSD kapasitesine
  - Seçili klavye dili ve düzenine
  - Monitör boyutuna
  - RAM miktarına
  answer: 1
  explanation: AltGr kombinasyonları klavye düzenine göre değişebilir.
- id: q20
  question: İyi klavye kullanımı için en doğru yaklaşım hangisidir?
  options:
  - Bütün kısayolları ezberleyip anlamını bilmemek
  - Fareyi hiçbir zaman kullanmamak
  - Her tuşa aynı anda basmak
  - Tuşların görevini ve bağlamını anlayıp uygun kısayolları bilinçli kullanmak
  answer: 3
  explanation: Klavye hâkimiyeti amaçlı ve kontrollü kullanım demektir.
