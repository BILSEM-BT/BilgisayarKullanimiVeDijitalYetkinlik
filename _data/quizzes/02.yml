title: Windows Masaüstü, Başlat Menüsü ve Görev Çubuğu
description: Masaüstü, Başlat, görev çubuğu, pencereler, Alt+Tab ve Tutturma özelliklerini senaryolarla kontrol et.
questions:
- id: q1
  question: Windows'ta Başlat menüsünü klavyeden açmanın en temel yolu hangisidir?
  options:
  - Windows tuşuna basmak
  - Ctrl + P
  - F2
  - Alt + Enter
  answer: 0
  explanation: Windows tuşu Başlat menüsünü açıp kapatmak için kullanılır.
- id: q2
  question: Bir uygulamayı Başlat menüsünde uzun uzun aramak yerine hızlıca bulmanın iyi yolu hangisidir?
  options:
  - Masaüstü arka planını değiştirmek
  - Başlat'ı açıp uygulama adını yazmak
  - Bilgisayarı kapatmak
  - Dosyanın uzantısını değiştirmek
  answer: 1
  explanation: Windows araması uygulama, ayar ve dosyalara hızlı erişim sağlar.
- id: q3
  question: Görev çubuğundaki bir uygulama simgesinin sabitlenmiş olması ne anlama gelir?
  options:
  - Uygulamanın mutlaka o anda çalıştığı
  - Uygulamanın iki kez kurulduğu
  - Uygulamaya hızlı erişim için simgenin görev çubuğunda tutulması
  - Uygulamanın silinemeyeceği
  answer: 2
  explanation: Sabitlenmiş uygulama kapalı da olabilir; sabitleme hızlı erişim sağlar.
- id: q4
  question: Bir pencereyi simge durumuna küçülttüğünde ne olur?
  options:
  - Uygulama bilgisayardan kaldırılır
  - Dosyalar otomatik silinir
  - Windows kapanır
  - Pencere ekrandan çekilir ama uygulama genellikle çalışmaya devam eder
  answer: 3
  explanation: Simge durumuna küçültme ile kapatma farklı işlemlerdir.
- id: q5
  question: Bir pencerenin sağ üstündeki X düğmesi genel olarak ne yapar?
  options:
  - Pencereyi görev çubuğuna sabitler
  - Pencereyi veya uygulamayı kapatır
  - Dosyayı kopyalar
  - Ayarlar'ı açar
  answer: 1
  explanation: X düğmesi etkin pencereyi kapatmak için kullanılır.
- id: q6
  question: Alt + Tab kısayolu ne için kullanılır?
  options:
  - Bilgisayarı kilitlemek
  - Dosya Gezgini'ni açmak
  - Açık uygulamalar arasında geçiş yapmak
  - Metni kopyalamak
  answer: 2
  explanation: Alt+Tab, açık uygulama pencereleri arasında geçiş yapar.
- id: q7
  question: Windows + D kısayolunun işlevi nedir?
  options:
  - Ayarlar'ı açmak
  - Dosya silmek
  - Görev Yöneticisi'ni açmak
  - Masaüstünü görüntülemek veya gizlemek
  answer: 3
  explanation: Windows+D açık pencereleri geçici olarak geri plana alıp masaüstünü gösterir veya geri getirir.
- id: q8
  question: Windows + L kısayolu hangi amaçla kullanılır?
  options:
  - Bilgisayarı kilitlemek
  - Dosya Gezgini'ni açmak
  - Yeni klasör oluşturmak
  - Pencereyi sola yaslamak
  answer: 0
  explanation: Bilgisayarı kısa süre bırakırken oturumu kilitlemek güvenli bir alışkanlıktır.
- id: q9
  question: Windows 11'de Tutturma (Snap) özelliğinin amacı nedir?
  options:
  - Dosyaları ZIP yapmak
  - Klavye dilini değiştirmek
  - Birden fazla pencereyi ekranda düzenli yerleştirmeyi kolaylaştırmak
  - Windows'u güncellemek
  answer: 2
  explanation: Snap, pencereleri ekran kenarlarına veya hazır düzenlere yerleştirerek çoklu çalışmayı kolaylaştırır.
- id: q10
  question: Windows + Z kısayolu desteklenen Windows 11 düzenlerinde ne açabilir?
  options:
  - Geri Dönüşüm Kutusu'nu
  - Pano geçmişini
  - Yazdırma penceresini
  - Tutturma düzenlerini
  answer: 3
  explanation: Microsoft belgelerine göre Windows+Z, Snap Layouts/Tutturma düzenlerini açabilir.
- id: q11
  question: Bir pencereyi ekranın sol kenarına sürüklemek genellikle ne sağlar?
  options:
  - Pencereyi ekranın sol tarafına tutturmayı
  - Uygulamayı kaldırmayı
  - Dosyayı Masaüstü'ne kopyalamayı
  - Bilgisayarı yeniden başlatmayı
  answer: 0
  explanation: Snap özelliği pencereyi kenara sürükleyerek ekranın bir bölümüne yerleştirebilir.
- id: q12
  question: Başlat menüsüne bir uygulamayı sabitlemek ne yapmaz?
  options:
  - Uygulamaya daha hızlı erişim sağlayabilir
  - Uygulamayı ikinci kez kurmaz
  - Başlat menüsünde görünmesini kolaylaştırabilir
  - Sık kullanılan uygulamayı erişilebilir tutabilir
  answer: 1
  explanation: Sabitlemek yalnız erişim düzenidir; kurulum işlemi değildir.
- id: q13
  question: Görev çubuğunun sağ tarafındaki ağ, ses ve pil gibi simgeler ne sağlar?
  options:
  - Word belgesini otomatik kaydetme
  - CPU'yu fiziksel olarak değiştirme
  - Dosyaları PDF'ye çevirme
  - Sistem durumunu görme ve bazı hızlı ayarlara erişme
  answer: 3
  explanation: Bu alan ağ, ses, pil ve hızlı ayarlar gibi günlük sistem durumlarına erişim sunar.
- id: q14
  question: Simge durumuna küçültülen bir uygulamayı tekrar nasıl getirebilirsin?
  options:
  - Görev çubuğundaki ilgili uygulama simgesine tıklayarak
  - Bilgisayarın fişini çekerek
  - Dosya uzantısını değiştirerek
  - Klavye dilini değiştirerek
  answer: 0
  explanation: Minimize edilen pencere görev çubuğu üzerinden yeniden görünür hâle getirilebilir.
- id: q15
  question: Bir Word belgesini kapatırken 'Kaydedilsin mi?' uyarısı çıkarsa en doğru davranış nedir?
  options:
  - Her zaman Kaydetme'yi seçmek
  - Uyarıyı okuyup çalışmanın kaydedilip kaydedilmediğine göre bilinçli seçim yapmak
  - Uyarıyı okumadan bilgisayarı kapatmak
  - Dosya uzantısını silmek
  answer: 1
  explanation: Kaydedilmemiş çalışma veri kaybına yol açabileceği için uyarı dikkatle okunmalıdır.
- id: q16
  question: İki pencereyi yan yana kullanmanın yararlı olduğu bir durum hangisidir?
  options:
  - Bilgisayarı fiziksel olarak soğutmak
  - USB belleği formatlamak
  - Bir kaynağı tarayıcıda okuyup Word'e not almak
  - Klavye sürücüsünü silmek
  answer: 2
  explanation: Yan yana pencereler aynı anda iki içeriği görmeyi kolaylaştırır.
- id: q17
  question: Başlat menüsü temel olarak neye hızlı erişim sağlar?
  options:
  - Uygulama, ayar ve dosyalara
  - Yalnız BIOS ayarlarına
  - Sadece internet kablosuna
  - Yalnız yazıcı kâğıdına
  answer: 0
  explanation: Başlat menüsü Windows'ta uygulama, ayar ve dosya bulmanın ana yollarındandır.
- id: q18
  question: Masaüstündeki bir uygulama kısayolunu silmek çoğu durumda ne anlama gelir?
  options:
  - Uygulamanın kesin olarak kaldırılması
  - Windows'un silinmesi
  - Yalnız kısayolun kaldırılması; uygulama bilgisayarda kalabilir
  - SSD'nin biçimlendirilmesi
  answer: 2
  explanation: Kısayol, asıl uygulamaya erişim bağlantısıdır.
- id: q19
  question: Pencereyi 'ekranı kapla' yaptığında ne olur?
  options:
  - Uygulama kapanır
  - Pencere kullanılabilir ekran alanını büyük ölçüde doldurur
  - Bilgisayar kilitlenir
  - Dosya otomatik paylaşılır
  answer: 1
  explanation: Maximize/ekranı kapla pencereyi büyütür; kapatma işlemi değildir.
- id: q20
  question: Windows çalışma alanını verimli kullanmak için en doğru yaklaşım hangisidir?
  options:
  - Bütün uygulamaları masaüstüne kopyalamak
  - Her işlemde bilgisayarı yeniden başlatmak
  - Aynı anda yalnız tek uygulama kurmak
  - Başlat aramasını, görev çubuğunu, pencere düzenlemeyi ve klavye geçişlerini amaca göre kullanmak
  answer: 3
  explanation: Windows araçlarını amaca göre kullanmak hızlı ve düzenli çalışma sağlar.
