title: Windows Ayarları, Uygulamalar ve Güncellemeler
description: Windows Ayarlar, ses, Bluetooth, uygulama kaldırma, varsayılan uygulamalar, izinler ve güncelleme bilgisini değerlendir.
questions:
- id: q1
  question: Windows Ayarlar uygulamasını hızlı açan kısayol hangisidir?
  options:
  - Windows + I
  - Windows + E
  - Ctrl + C
  - Alt + F4
  answer: 0
  explanation: Windows+I Windows Ayarlar uygulamasını açar.
- id: q2
  question: Bir Windows ayarının nerede olduğunu bilmiyorsan ilk iyi yöntem hangisidir?
  options:
  - Rastgele bütün seçenekleri değiştirmek
  - Ayarlar içindeki arama kutusunda ilgili kavramı aramak
  - Bilgisayarı formatlamak
  - Dosya uzantısını değiştirmek
  answer: 1
  explanation: Ayarlar araması belirli ayara hızlı ulaşmayı sağlar.
- id: q3
  question: Kulaklık bağlı ama ses hoparlörden geliyor. İlk kontrollerden biri hangisidir?
  options:
  - Windows'u silmek
  - RAM'i çıkarmak
  - Doğru ses çıkış aygıtının seçili olup olmadığını kontrol etmek
  - Tüm uygulamaları kaldırmak
  answer: 2
  explanation: Ses sorununun yaygın nedenlerinden biri yanlış çıkış aygıtıdır.
- id: q4
  question: Windows'ta Bluetooth ayarları genellikle hangi bölümde bulunur?
  options:
  - Dosya Gezgini > Belgeler
  - Görev Yöneticisi > Performans
  - Word > Giriş
  - Ayarlar > Bluetooth ve cihazlar
  answer: 3
  explanation: Windows 11'de Bluetooth cihaz yönetimi Ayarlar içindeki Bluetooth ve cihazlar bölümündedir.
- id: q5
  question: Masaüstündeki bir uygulama kısayolunu silmek ne anlama gelmez?
  options:
  - Kısayolun masaüstünden gidebileceği
  - Uygulamanın kesin olarak bilgisayardan kaldırıldığı
  - Uygulamaya başka yollardan erişilebileceği
  - Asıl programın sistemde kalabileceği
  answer: 1
  explanation: Kısayol ile program kurulumunun kendisi farklıdır.
- id: q6
  question: Windows 11'de bir uygulamayı kaldırmanın yaygın yollarından biri hangisidir?
  options:
  - Dosyanın uzantısını .zip yapmak
  - Görev çubuğu simgesini gizlemek
  - Ayarlar > Uygulamalar > Yüklü uygulamalar üzerinden Kaldır
  - Masaüstü duvar kâğıdını değiştirmek
  answer: 2
  explanation: Microsoft uygulamaları Ayarlar üzerinden kaldırma yolunu belgeler.
- id: q7
  question: Varsayılan uygulama neyi belirleyebilir?
  options:
  - CPU'nun fiziksel hızını
  - Wi-Fi parolasını
  - Monitörün marka adını
  - Belirli dosya türü veya bağlantının hangi uygulamayla açılacağını
  answer: 3
  explanation: Varsayılan uygulama ilişkilendirmeleri dosya ve protokollerin hangi programla açılacağını yönetir.
- id: q8
  question: Bir `.pdf` dosyasının hangi programla açıldığını değiştirmek için en uygun alan hangisidir?
  options:
  - Ayarlar > Uygulamalar > Varsayılan uygulamalar
  - Görev Yöneticisi > Kullanıcılar
  - Geri Dönüşüm Kutusu
  - BIOS menüsü
  answer: 0
  explanation: Dosya türü ilişkilendirmeleri Windows varsayılan uygulama ayarlarında yönetilir.
- id: q9
  question: Program indirirken en güvenli öncelik hangisidir?
  options:
  - Rastgele crack/full indirme sitesi
  - Kaynağı bilinmeyen dosya paylaşım bağlantısı
  - Programın resmî web sitesi veya güvenilir uygulama mağazası
  - Reklam açılır penceresi
  answer: 2
  explanation: Resmî ve güvenilir kaynaklar değiştirilmiş/zararlı kurulum riskini azaltır.
- id: q10
  question: Windows Update'in amaçlarından biri hangisidir?
  options:
  - RAM'i fiziksel olarak artırmak
  - Monitörü temizlemek
  - Dosyaları otomatik Word'e çevirmek
  - Güvenlik ve hata düzeltmeleriyle sistemi güncel tutmak
  answer: 3
  explanation: Windows Update güvenlik, hata düzeltmesi ve bazı özellik güncellemelerini dağıtır.
- id: q11
  question: Güncelleme sırasında 'Bilgisayarınızı kapatmayın' benzeri uyarı varsa ne yapmalısın?
  options:
  - Gücü zorla kesmemeli ve işlemin tamamlanmasını beklemelisin
  - Fişi hemen çekmelisin
  - SSD'yi çıkarmalısın
  - Ctrl+X yapmalısın
  answer: 0
  explanation: Güncellemenin yarıda kesilmesi sistem sorunlarına neden olabilir.
- id: q12
  question: Windows Update ile uygulama güncellemesi için en doğru ifade hangisidir?
  options:
  - Her uygulama yalnız Windows Update ile güncellenir
  - İşletim sistemi güncellemesi ile tek tek uygulama güncellemesi farklı mekanizmalar olabilir
  - İkisi tamamen aynıdır
  - Uygulamalar hiç güncellenmez
  answer: 1
  explanation: Uygulamalar mağaza veya kendi güncelleme sistemi üzerinden de güncellenebilir.
- id: q13
  question: Bildirimleri yönetmenin yararı nedir?
  options:
  - SSD kapasitesini iki katına çıkarmak
  - Klavyeyi hızlandırmak
  - İnternet parolasını değiştirmek
  - Gereksiz dikkat dağıtıcı uyarıları azaltıp önemli bildirimleri korumak
  answer: 3
  explanation: Bildirim ayarları çalışma sırasında dikkat yönetimine yardımcı olabilir.
- id: q14
  question: Bir uygulama mikrofon istemiyorsa ne yapmak daha doğrudur?
  options:
  - Gereksiz mikrofon izni vermemek
  - Her uygulamaya otomatik izin vermek
  - Windows Update'i kapatmak
  - Klasörü silmek
  answer: 0
  explanation: En az gerekli izin ilkesi gizlilik açısından daha güvenlidir.
- id: q15
  question: Wi-Fi bağlı görünmesi neyi garanti etmez?
  options:
  - Ağ simgesinin görünebileceğini
  - Bağlanılan ağın güvenilir olduğunu
  - İnternet erişimi olabileceğini
  - Kablosuz bağlantının açık olabileceğini
  answer: 1
  explanation: Bağlı olmak ile ağın güvenilir olması farklı kavramlardır.
- id: q16
  question: Ekrandaki yazılar çok küçükse hangi ayarı incelemek genellikle daha anlamlı ilk adımdır?
  options:
  - Dosya uzantısını
  - Görev Yöneticisi ağ sütununu
  - Ekran ölçeklendirme ayarını
  - Pano geçmişini
  answer: 2
  explanation: Ölçek, arayüz ve metinlerin ekrandaki görünür büyüklüğünü etkiler.
- id: q17
  question: Bluetooth seçeneğinin bir bilgisayarda görünmemesinin olası nedeni nedir?
  options:
  - Cihazda Bluetooth bağdaştırıcısı bulunmaması veya sürücüsünün hazır olmaması
  - Word belgesinin açık olması
  - Masaüstünde klasör bulunması
  - Ctrl+C kullanılmış olması
  answer: 0
  explanation: Microsoft, donanım veya sürücü yokluğunda Bluetooth seçeneklerinin bulunmayabileceğini belirtir.
- id: q18
  question: Ortak sınıf bilgisayarında başka öğrencinin hesabındaki dosyalara izinsiz girmek neden yanlıştır?
  options:
  - CPU kullanımını artırdığı için yalnız teknik olarak
  - Yalnız dosya adı uzunsa
  - Gizlilik ve dijital etik kurallarını ihlal eder
  - Klavye dili değiştiği için
  answer: 2
  explanation: Kullanıcı hesabı ve kişisel dosya alanına saygı dijital etik gereğidir.
- id: q19
  question: Bir ayarın anlamını bilmiyorsan en doğru davranış hangisidir?
  options:
  - Rastgele açıp kapatmak
  - Değiştirmeden önce açıklamasını araştırmak veya öğretmene sormak
  - Bütün ayarları varsayılan dışına almak
  - Uygulamaları silmek
  answer: 1
  explanation: Bilinçli ayar değişikliği, neyin değiştiğini ve etkisini anlamayı gerektirir.
- id: q20
  question: Windows Ayarlar dersinin en iyi özeti hangisidir?
  options:
  - Tüm ayarları ezberle ve her gün değiştir
  - Güncellemeleri daima kapat
  - Her programı rastgele sitelerden indir
  - Günlük ayarları arayarak bul, yalnız gerekli değişikliği yap, uygulama ve güncellemeleri güvenilir kaynaklarla yönet
  answer: 3
  explanation: Amaç kontrollü, güvenli ve bilinçli Windows yönetimidir.
