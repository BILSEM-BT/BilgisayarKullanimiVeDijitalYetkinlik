title: Visual Studio Code Insiders Kullanımı — Uygulama
description: VS Code Insiders kurulumu, arayüz alanları, çok dilli çalışma mantığı, Python eklentisi/yorumlayıcısı, terminal, çalıştırma, durdurma
  ve hata ayıklama kısayollarını ölçer.
questions:
- id: q1
  question: Visual Studio Code Insiders için doğru ifade hangisidir?
  options:
  - Yeni özellikleri günlük/çok sık yapılarla daha erken sunan ve Stable ile yan yana kurulabilen önizleme kanalıdır
  - Visual Studio Community’nin başka adıdır
  - Yalnız çevrim dışı çalışan bir Python yorumlayıcısıdır
  - Sadece GitHub Pages düzenleyicisidir
  answer: 0
  explanation: VS Code Insiders, yeni değişiklikleri Stable’dan önce alan önizleme sürümüdür ve Stable ile yan yana kurulabilir.
- id: q2
  question: VS Code Insiders için derste verilen resmî indirme adresi hangisidir?
  options:
  - visualstudio.microsoft.com/insiders/
  - code.visualstudio.com/insiders/
  - python.org/downloads/
  - scratch.mit.edu
  answer: 1
  explanation: Visual Studio Code Insiders, code.visualstudio.com/insiders/ adresinden indirilir.
- id: q3
  question: VS Code Insiders’ta Python geliştirmek için temel hazırlık hangisidir?
  options:
  - Yalnız Git kurmak
  - Sadece bir .py dosyası oluşturmak
  - Python yorumlayıcısı ile Microsoft Python eklentisini kurmak
  - Visual Studio Installer’dan C++ iş yükü seçmek
  answer: 2
  explanation: VS Code Python geliştirme akışı; çalışan bir Python yorumlayıcısı ve Microsoft Python extension/eklentisini gerektirir.
- id: q4
  question: VS Code’un programlama dilleriyle ilişkisi için en doğru ifade hangisidir?
  options:
  - Yalnız Python kodu yazabilir
  - Yalnız JavaScript çalıştırır
  - Her dili eklentisiz aynı özelliklerle destekler
  - Birçok dilde metin/kod düzenlenebilir; dil özellikleri ve çalıştırma için ilgili çalışma zamanı/SDK/derleyici ve çoğu zaman eklenti gerekir
  answer: 3
  explanation: VS Code çok dilli bir editördür; gerçek çalıştırma ve gelişmiş dil desteği ilgili araç zincirine bağlıdır.
- id: q5
  question: VS Code’daki Activity Bar’ın temel görevi nedir?
  options:
  - Explorer, Search, Source Control, Run and Debug ve Extensions gibi ana görünümler arasında geçiş sağlamak
  - Programın Python sürümünü derlemek
  - Sadece terminal çıktısını temizlemek
  - Windows kullanıcı hesabını değiştirmek
  answer: 0
  explanation: Activity Bar ana çalışma görünümlerine erişim sağlar.
- id: q6
  question: Primary Side Bar genellikle ne gösterir?
  options:
  - Yalnız saat ve tarih
  - Seçilen görünümün içeriğini; örneğin Explorer’daki dosya ağacını
  - Sadece çalışan Python çıktısını
  - BIOS ayarlarını
  answer: 1
  explanation: Primary Side Bar, Activity Bar’dan seçilen görünümün ayrıntılarını gösterir.
- id: q7
  question: VS Code’daki Panel alanında hangileri bulunabilir?
  options:
  - Yalnız masaüstü simgeleri
  - Sadece uzantı mağazası
  - Terminal, Problems, Output ve Debug Console gibi araçlar
  - Windows Denetim Masası
  answer: 2
  explanation: Panel; Terminal, Problems, Output ve Debug Console gibi çalışma alanlarını barındırabilir.
- id: q8
  question: Status Bar ne tür bilgiler gösterebilir?
  options:
  - Yalnız bilgisayarın seri numarasını
  - Sadece tarayıcı geçmişini
  - Yalnız dosya boyutunu
  - Etkin dosya/dil, satır-sütun, kaynak kontrolü ve seçili Python ortamı gibi bağlamsal durumları
  answer: 3
  explanation: Status Bar etkin çalışma bağlamıyla ilgili hızlı durum bilgileri verir.
- id: q9
  question: Command Palette’ı açmak için yaygın VS Code kısayolu hangisidir?
  options:
  - Ctrl+Shift+P
  - Ctrl+Alt+Delete
  - F2
  - Alt+Tab
  answer: 0
  explanation: Ctrl+Shift+P, Command Palette’ı açar.
- id: q10
  question: Dosyalara hızlı gitmek için kullanılan Quick Open kısayolu hangisidir?
  options:
  - Ctrl+Shift+X
  - Ctrl+P
  - Ctrl+K
  - Alt+P
  answer: 1
  explanation: Ctrl+P, Quick Open ile dosya adına göre hızlı açma sağlar.
- id: q11
  question: VS Code tümleşik terminalini açmak/göstermek için yaygın kısayol hangisidir?
  options:
  - Ctrl+Shift+S
  - Alt+T
  - Ctrl+`
  - F7
  answer: 2
  explanation: Ctrl+` (backtick), tümleşik terminali açmak/göstermek için kullanılan yaygın kısayoldur.
- id: q12
  question: Primary Side Bar’ı açıp kapatmak için hangi kısayol kullanılır?
  options:
  - Ctrl+Shift+B
  - F4
  - Ctrl+J
  - Ctrl+B
  answer: 3
  explanation: Ctrl+B, Primary Side Bar görünürlüğünü değiştirir.
- id: q13
  question: Birden fazla Python kurulumu varsa doğru yorumlayıcıyı seçmek için hangi komut kullanılabilir?
  options:
  - 'Python: Select Interpreter'
  - 'Git: Clone'
  - 'Terminal: Kill All'
  - 'File: Revert File'
  answer: 0
  explanation: 'Python: Select Interpreter komutu, çalışma alanında kullanılacak Python ortamını seçmeye yarar.'
- id: q14
  question: Açık Python dosyasını terminalde çalıştırmanın ders içinde gösterilen kolay yolu hangisidir?
  options:
  - Explorer’dan dosyayı silmek
  - Run Python File in Terminal düğmesini/komutunu kullanmak
  - Extensions görünümünü kapatmak
  - Status Bar’ı gizlemek
  answer: 1
  explanation: Microsoft Python eklentisi Run Python File in Terminal komutuyla açık dosyayı seçili yorumlayıcıda çalıştırabilir.
- id: q15
  question: Seçili Python satırını veya kod parçasını terminale gönderip çalıştırmak için yaygın kısayol hangisidir?
  options:
  - Ctrl+Enter
  - Alt+Enter
  - Shift+Enter
  - Ctrl+Shift+Enter
  answer: 2
  explanation: VS Code Python desteğinde Shift+Enter seçili satırı/kodu Python terminalinde çalıştırabilir.
- id: q16
  question: VS Code’da Python hata ayıklamasını başlatmak için yaygın tuş hangisidir?
  options:
  - F1
  - F9
  - F10
  - F5
  answer: 3
  explanation: F5 Run and Debug/hata ayıklama akışını başlatır.
- id: q17
  question: Breakpoint ne işe yarar?
  options:
  - Program belirli satıra geldiğinde yürütmeyi duraklatıp değişken ve program durumunu incelemeyi sağlar
  - Dosyayı sıkıştırır
  - Bir eklentiyi günceller
  - Terminal yazı tipini değiştirir
  answer: 0
  explanation: Kesme noktası programın belirli noktada duraklamasını sağlar ve hata ayıklamayı kolaylaştırır.
- id: q18
  question: Hata ayıklamada F10 genellikle hangi komuttur?
  options:
  - Stop
  - Step Over
  - Step Into
  - Restart
  answer: 1
  explanation: F10, Step Over komutudur; mevcut satırı çalıştırıp çağrının içine girmeden sonraki satıra ilerler.
- id: q19
  question: VS Code hata ayıklama oturumunu durdurmanın yaygın kısayolu hangisidir?
  options:
  - Ctrl+C
  - F11
  - Shift+F5
  - Ctrl+Shift+P
  answer: 2
  explanation: Shift+F5 debug oturumunu durdurur. Terminaldeki normal ön plan sürecini kesmek ise çoğu zaman Ctrl+C ile yapılır.
- id: q20
  question: Terminalde çalışan bir Python programını klavyeden kesmek için genellikle hangi birleşim kullanılır?
  options:
  - Shift+F5
  - Ctrl+P
  - Ctrl+B
  - Ctrl+C
  answer: 3
  explanation: Terminalde Ctrl+C ön plan sürecine kesme sinyali gönderir; Python çoğu zaman KeyboardInterrupt ile durur.
