title: Klavye Tuşları ve Klavye Kısayolları
description: Türkçe Q klavye, Shift/AltGr karakter mantığı, düzenleme ve Windows kısayollarını değerlendir.
questions:
- id: q1
  question: Türkçe Q klavyede çok karakterli bir tuşun sol üst köşesindeki karakteri yazmak için hangi tuş kullanılır?
  options:
  - Shift
  - Ctrl
  - AltGr
  - Caps Lock
  answer: 0
  explanation: Bu dersteki Türkçe Q gösteriminde sol üst karakter Shift ile yazılır.
- id: q2
  question: Türkçe Q klavyede çok karakterli bir tuşun sağ alt köşesindeki üçüncü karakteri yazmak için hangi tuş kullanılır?
  options:
  - Shift
  - AltGr
  - Tab
  - Esc
  answer: 1
  explanation: AltGr, Türkçe Q düzeninde sağ alt seviyedeki üçüncü karakterlere erişmek için kullanılır.
- id: q3
  question: Türkçe Q düzeninde `@` işareti hangi birleşimle yazılır?
  options:
  - Shift + Q
  - Ctrl + Q
  - AltGr + Q
  - Alt + 2
  answer: 2
  explanation: Windows Türkçe Q düzeninde Q tuşunun AltGr seviyesi @ işaretidir.
- id: q4
  question: Türkçe Q düzeninde `!` işareti hangi birleşimle yazılır?
  options:
  - AltGr + 1
  - Ctrl + 1
  - Shift + 2
  - Shift + 1
  answer: 3
  explanation: 1 tuşunun Shift seviyesinde ! bulunur.
- id: q5
  question: Türkçe Q düzeninde `{` karakteri nasıl yazılır?
  options:
  - Shift + 7
  - AltGr + 7
  - Ctrl + 7
  - AltGr + 8
  answer: 1
  explanation: 7 tuşunun AltGr seviyesinde { karakteri bulunur.
- id: q6
  question: Türkçe Q düzeninde `[` karakteri nasıl yazılır?
  options:
  - Shift + 8
  - AltGr + 9
  - AltGr + 8
  - Ctrl + 8
  answer: 2
  explanation: 8 tuşunun AltGr seviyesinde [ karakteri bulunur.
- id: q7
  question: Türkçe Q düzeninde Türk lirası simgesi `₺` hangi birleşimle yazılır?
  options:
  - Shift + T
  - AltGr + E
  - Ctrl + T
  - AltGr + T
  answer: 3
  explanation: Windows Türkçe Q düzeninde T tuşunun AltGr seviyesi ₺ simgesidir.
- id: q8
  question: Backspace tuşunun metindeki yaygın görevi nedir?
  options:
  - İmlecin solundaki karakteri silmek
  - İmlecin sağındaki karakteri silmek
  - Tüm belgeyi seçmek
  - Yeni paragraf açmak
  answer: 0
  explanation: Backspace genellikle imlecin solundaki karakteri siler.
- id: q9
  question: Delete tuşunun metindeki yaygın görevi nedir?
  options:
  - İmlecin solundaki karakteri silmek
  - Belgeyi kaydetmek
  - İmlecin sağındaki karakteri veya seçili içeriği silmek
  - Sekme değiştirmek
  answer: 2
  explanation: Delete, imlecin sağını veya seçili öğeyi silmekte kullanılır.
- id: q10
  question: '`Shift + Tab` çoğu form ve iletişim kutusunda ne yapar?'
  options:
  - Bir sonraki alana geçer
  - Pencereyi kapatır
  - Pano geçmişini açar
  - Bir önceki alana/öğeye geri gider
  answer: 3
  explanation: Tab ileri, Shift+Tab geriye doğru odak hareketi sağlar.
- id: q11
  question: '`Ctrl + Sağ Ok` çoğu metin alanında ne yapar?'
  options:
  - İmleci sonraki kelimeye doğru taşır
  - Tüm metni seçer
  - Satırı siler
  - Pencereyi sağa yaslar
  answer: 0
  explanation: Ctrl ile ok tuşları çoğu düzenleyicide kelime bazında gezinir.
- id: q12
  question: '`Shift + Sağ Ok` ne için kullanılır?'
  options:
  - Belgeyi kaydetmek
  - Metni karakter karakter seçimi genişletmek
  - Tarayıcıyı yenilemek
  - Klavyeyi Türkçeye çevirmek
  answer: 1
  explanation: Shift ile gezinme tuşları seçim alanını genişletir.
- id: q13
  question: '`Ctrl + C` ne yapar?'
  options:
  - Seçili içeriği taşımak üzere keser
  - Panodakini yapıştırır
  - Programı kapatır
  - Seçili içeriği panoya kopyalar
  answer: 3
  explanation: Ctrl+C seçili içeriğin kopyasını panoya alır.
- id: q14
  question: '`Ctrl + X` ne yapar?'
  options:
  - Seçili içeriği taşımak üzere keser
  - Seçili içeriği kopyalar
  - Son işlemi geri alır
  - Tümünü seçer
  answer: 0
  explanation: Ctrl+X kesme komutudur; içerik yapıştırılmak üzere panoya alınır.
- id: q15
  question: '`Ctrl + V` ne yapar?'
  options:
  - Panoyu temizler
  - Panodaki içeriği yapıştırır
  - Pencereyi küçültür
  - Belgeyi yazdırır
  answer: 1
  explanation: Ctrl+V panodaki son uygun içeriği hedef konuma yapıştırır.
- id: q16
  question: '`Windows + E` kısayolu ne açar?'
  options:
  - Ayarlar
  - Görev Yöneticisi
  - Dosya Gezgini
  - Pano geçmişi
  answer: 2
  explanation: Windows+E Dosya Gezgini kısayoludur.
- id: q17
  question: '`Windows + Ara Çubuğu` ne için kullanılır?'
  options:
  - Yüklü giriş dilleri ve klavye düzenleri arasında geçmek
  - Dosyayı kalıcı silmek
  - Ekran görüntüsü almak
  - Bilgisayarı kapatmak
  answer: 0
  explanation: Windows+Ara Çubuğu giriş dili/klavye düzeni değiştirir.
- id: q18
  question: '`Alt + Tab` kısayolunun görevi nedir?'
  options:
  - Etkin uygulamayı kapatmak
  - Dosyayı yeniden adlandırmak
  - Açık uygulamalar arasında geçiş yapmak
  - Yazdırma penceresini açmak
  answer: 2
  explanation: Alt+Tab açık pencereler/uygulamalar arasında geçiş için kullanılır.
- id: q19
  question: '`F2` Windows Dosya Gezgini’nde seçili öğede yaygın olarak ne yapar?'
  options:
  - Öğeyi kopyalar
  - Yeniden adlandırmayı başlatır
  - Bilgisayarı kilitler
  - Ayarlar uygulamasını açar
  answer: 1
  explanation: Microsoft Windows kısayollarında F2 seçili öğeyi yeniden adlandırır.
- id: q20
  question: Bir fiziksel klavyede tuşlar Türkçe Q görünmesine rağmen yanlış karakterler çıkıyorsa ilk kontrol ne olmalıdır?
  options:
  - Monitör parlaklığı
  - Dosya uzantıları
  - Hoparlör ses düzeyi
  - Windows’ta seçili giriş dili/klavye düzeni
  answer: 3
  explanation: Fiziksel tuş üzerindeki baskı ile işletim sisteminde seçilen klavye düzeni farklı olabilir.
