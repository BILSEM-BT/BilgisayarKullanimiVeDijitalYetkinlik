  title: Dijital Medya ve İçerik Üretimi
  description: WinRAR/7-Zip ile sıkıştırma, VLC, ekran kaydı, GIMP, Inkscape ve Audacity ile günlük dijital içerik işlemleri.
- id: 6
  title: Yazılım Geliştirme ve Proje Araçları
  description: Visual Studio, VS Code, akış şemaları, Git/GitHub, GitHub Pages ve Google Colab.
- id: 7
  title: Blok Programlama, Robotik ve Elektronik
  description: Scratch, mBlock, MakeCode, Tinkercad Circuits, Arduino ve robotik proje geliştirme.
- id: 8
  title: 3D Tasarım ve Dijital Üretim
  description: Tinkercad, Onshape, SOLIDWORKS, 3D yazıcı-slicer ve Blender ile 3D tasarım ve dijital üretim.
