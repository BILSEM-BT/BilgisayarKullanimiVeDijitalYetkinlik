- id: 1
  title: Bilgisayar ve Windows Kullanımı
  description: Bilgisayarın gelişimini kavra; bilgisayarı tanı, Windows masaüstünü, klavye-fareyi, dosya-klasör yönetimini
    ve temel ayarları güvenle kullan.
- id: 2
  title: İnternet, Web, E-Posta ve Bulut
  description: İnternete bağlanma ve tarayıcı kullanımı, etkili arama, bilgi doğrulama, güvenli dosya kullanımı, Gmail, Drive
